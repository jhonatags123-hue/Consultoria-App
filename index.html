<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultoria Inteligente — Área do Aluno</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080103;
    --card: rgba(36, 4, 12, 0.92);
    --border: #6e1327;
    --accent: #ff2a2a;
    --gold: #ffcc00;
    --green: #25d366;
    --text: #ffffff;
    --muted: #f0c2cd;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: radial-gradient(circle at top, #3b0612 0%, #080103 85%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    padding: 16px;
    max-width: 500px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 2px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }
  
  .title { font-size: 18px; font-weight: 900; color: #fff; margin-bottom: 12px; text-transform: uppercase; }
  
  input, select, textarea {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(15, 2, 5, 0.85);
    color: #fff;
    font-size: 14px;
    margin-bottom: 12px;
    outline: none;
  }

  .btn {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    font-weight: 900;
    font-size: 14px;
    text-align: center;
    text-decoration: none;
    display: block;
    cursor: pointer;
    border: none;
    transition: all 0.2s ease;
    text-transform: uppercase;
  }
  .btn-primary {
    background: linear-gradient(90deg, #ff2a2a 0%, #b80d0d 100%);
    color: #fff;
    box-shadow: 0 4px 20px rgba(255, 42, 42, 0.5);
  }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: #fff; }

  /* CAIXA DE FEEDBACK E ERROS */
  .feedback-msg {
    padding: 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 12px;
    display: none;
    text-align: center;
  }
  .feedback-msg.error { background: rgba(255, 42, 42, 0.2); border: 1px solid var(--accent); color: #ff8888; }
  .feedback-msg.info { background: rgba(255, 204, 0, 0.2); border: 1px solid var(--gold); color: var(--gold); }

  /* NAVEGAÇÃO DE ABAS */
  .tabs-nav { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab-btn {
    flex: 1; padding: 12px 8px; border-radius: 10px; background: rgba(15, 2, 5, 0.8);
    border: 1px solid var(--border); color: var(--muted); font-weight: 800; font-size: 12px; cursor: pointer; text-align: center;
  }
  .tab-btn.active { background: var(--border); color: #fff; border-color: var(--gold); }

  /* EXERCÍCIOS */
  .exercise-item {
    background: rgba(15, 2, 5, 0.85); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px;
  }
  .exercise-name { font-weight: 800; font-size: 14px; color: #fff; }
  .exercise-details { font-size: 12px; color: var(--gold); margin-top: 4px; font-weight: 700; }
  .load-input { width: 100px; padding: 6px 10px; margin-bottom: 0; margin-top: 8px; font-size: 12px; text-align: center; }

  /* CHAT IA */
  .chat-box { display: flex; flex-direction: column; height: 380px; background: rgba(15, 2, 5, 0.9); border: 1px solid var(--border); border-radius: 16px; padding: 12px; }
  .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
  .chat-bubble { max-width: 85%; padding: 12px 14px; border-radius: 14px; font-size: 13px; line-height: 1.4; }
  .chat-bubble.user { background: var(--border); color: #fff; align-self: flex-end; }
  .chat-bubble.assistant { background: rgba(56, 6, 18, 0.9); border: 1px solid var(--gold); color: #fff; align-self: flex-start; }

  .chat-chips-container { display: flex; gap: 8px; overflow-x: auto; padding: 6px 0; margin-bottom: 8px; scrollbar-width: none; }
  .chat-chips-container::-webkit-scrollbar { display: none; }
  .chip-btn { background: rgba(110, 19, 39, 0.6); border: 1px solid var(--border); color: var(--muted); font-size: 11px; font-weight: 800; padding: 6px 12px; border-radius: 20px; white-space: nowrap; cursor: pointer; }
  .chat-input-row { display: flex; gap: 8px; }
  .chat-input-row input { margin-bottom: 0; }
</style>
</head>
<body>

  <!-- TELA DE LOGIN COM FEEDBACK DE SENHA -->
  <div id="loginSection" class="card">
    <div class="title">🔑 Área do Aluno</div>
    
    <div id="loginFeedback" class="feedback-msg"></div>

    <input type="text" id="userCodeInput" placeholder="Usuário / Código (ex: erick, julia)">
    <input type="password" id="userPassInput" placeholder="Sua Senha">
    
    <button class="btn btn-primary" id="loginBtn" onclick="fazerLogin()">ENTRAR NO APLICATIVO</button>
    <button class="btn btn-outline" style="margin-top:10px;" onclick="mostrarAnamnese()">PREENCHER ANAMNESE</button>
  </div>

  <!-- TELA DE ANAMNESE -->
  <div id="anamneseSection" class="card" style="display:none;">
    <div class="title">📋 Anamnese Inicial</div>
    <input type="text" id="anaNome" placeholder="Seu nome completo">
    <input type="text" id="anaObjetivo" placeholder="Seu objetivo principal">
    <select id="anaNivel">
      <option value="Iniciante">Iniciante</option>
      <option value="Intermediario">Intermediário</option>
      <option value="Avançado">Avançado</option>
    </select>
    <input type="text" id="anaFrequencia" placeholder="Frequência semanal de treinos">
    <textarea id="anaLesoes" placeholder="Possui dores ou lesões?"></textarea>
    
    <button class="btn btn-primary" onclick="enviarAnamneseWhatsApp()">ENVIAR ANAMNESE</button>
    <button class="btn btn-outline" style="margin-top:10px;" onclick="voltarParaLogin()">VOLTAR AO LOGIN</button>
  </div>

  <!-- APP PRINCIPAL DO ALUNO -->
  <div id="appSection" style="display:none; flex-direction:column; gap:16px;">
    
    <div class="card">
      <div class="title" id="studentWelcome">Bem-vindo(a)!</div>
      <p style="font-size:13px; color:var(--muted);" id="protocolTitle">Protocolo de Treino & Nutrição</p>
    </div>

    <div class="tabs-nav">
      <button class="tab-btn active" onclick="trocarAba('treinosTab', this)">🏋️ TREINOS</button>
      <button class="tab-btn" onclick="trocarAba('dietaTab', this)">🥗 DIETA</button>
      <button class="tab-btn" onclick="trocarAba('iaTab', this)">🤖 ASSISTENTE IA</button>
    </div>

    <!-- TREINOS -->
    <div id="treinosTab" class="card">
      <div class="title" style="color:var(--gold);">Ficha de Exercícios</div>
      <div id="treinosContainer"></div>
    </div>

    <!-- DIETA -->
    <div id="dietaTab" class="card" style="display:none;">
      <div class="title" style="color:var(--gold);">Plano Alimentar</div>
      <div id="dietaContainer"></div>
    </div>

    <!-- CHAT IA -->
    <div id="iaTab" class="card" style="display:none;">
      <div class="title" style="color:var(--gold); font-size:16px;">🤖 JHONATA AI</div>
      
      <div class="chat-box">
        <div class="chat-messages" id="chatMessages">
          <div class="chat-bubble assistant">
            Olá! Sou o Jhonata AI. Tenho acesso ao seu treino e dieta. Como posso te ajudar hoje?
          </div>
        </div>

        <div class="chat-chips-container">
          <button class="chip-btn" onclick="enviarMensagemIA('Como posso substituir o arroz do meu almoço hoje?')">💡 Trocar arroz</button>
          <button class="chip-btn" onclick="enviarMensagemIA('A academia tá cheia, qual exercício substitui o primeiro do meu treino?')">🏋️ Substituir exercício</button>
          <button class="chip-btn" onclick="enviarMensagemIA('O que posso comer de pré-treino rápido 30min antes de treinar?')">⚡ Pré-treino rápido</button>
        </div>

        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="Pergunte sobre seu treino ou dieta..." onkeypress="if(event.key==='Enter') enviarMensagemIA()">
          <button class="btn btn-primary" style="width: auto; padding: 0 18px;" onclick="enviarMensagemIA()">➔</button>
        </div>
      </div>
    </div>

  </div>

<script>
let studentData = {};
let chatHistory = [];

window.onload = function() {
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('modo') === 'anamnese') {
    mostrarAnamnese();
  }
};

function mostrarFeedback(msg, tipo = "error") {
  const fb = document.getElementById("loginFeedback");
  fb.innerText = msg;
  fb.className = `feedback-msg ${tipo}`;
  fb.style.display = "block";
}

function limparFeedback() {
  const fb = document.getElementById("loginFeedback");
  fb.style.display = "none";
}

function mostrarAnamnese() {
  document.getElementById("loginSection").style.display = "none";
  document.getElementById("anamneseSection").style.display = "block";
}

function voltarParaLogin() {
  document.getElementById("anamneseSection").style.display = "none";
  document.getElementById("loginSection").style.display = "block";
}

// FUNCIONALIDADE DE LOGIN COM SENHA E FEEDBACK VISUAL
async function fazerLogin() {
  limparFeedback();
  const code = document.getElementById("userCodeInput").value.trim().toLowerCase();
  const pass = document.getElementById("userPassInput").value.trim();

  if(!code) return mostrarFeedback("Por favor, informe seu usuário ou código.");
  if(!pass) return mostrarFeedback("Por favor, digite sua senha.");

  const btn = document.getElementById("loginBtn");
  btn.innerText = "VERIFICANDO...";
  btn.disabled = true;

  try {
    const res = await fetch(`./data/${code}.json`);
    if(!res.ok) {
      btn.innerText = "ENTRAR NO APLICATIVO";
      btn.disabled = false;
      return mostrarFeedback("Usuário não encontrado. Verifique o nome informado.");
    }
    
    studentData = await res.json();

    // Validação da Senha salva no arquivo JSON
    if(studentData.senha && studentData.senha.toLowerCase() !== pass.toLowerCase()) {
      btn.innerText = "ENTRAR NO APLICATIVO";
      btn.disabled = false;
      return mostrarFeedback("Senha incorreta! Tente novamente.");
    }

    // Sucesso
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("appSection").style.display = "flex";
    
    document.getElementById("studentWelcome").innerText = `Olá, ${studentData.clientName || code}!`;
    if(studentData.title) document.getElementById("protocolTitle").innerText = studentData.title;

    renderizarTreinos();
    renderizarDieta();

  } catch(e) {
    btn.innerText = "ENTRAR NO APLICATIVO";
    btn.disabled = false;
    mostrarFeedback("Erro ao carregar dados do aluno. Tente novamente.");
  }
}

// RENDERIZAR TREINOS COM REGISTRO DE CARGAS
function renderizarTreinos() {
  const container = document.getElementById("treinosContainer");
  container.innerHTML = "";

  if(!studentData.days || studentData.days.length === 0) {
    container.innerHTML = "<p style='font-size:13px; color:var(--muted);'>Nenhum treino cadastrado.</p>";
    return;
  }

  studentData.days.forEach(day => {
    let html = `<div style='margin-bottom:18px;'><h4 style='color:var(--gold); margin-bottom:8px;'>${day.title}</h4>`;
    
    day.exercicios.forEach(ex => {
      const cargaSalva = localStorage.getItem(`carga_${studentData.code}_${ex.id}`) || ex.carga || '';
      html += `
        <div class="exercise-item">
          <div class="exercise-name">${ex.nome}</div>
          <div class="exercise-details">${ex.series} séries x ${ex.reps} reps</div>
          <div style="display:flex; align-items:center; gap:8px; margin-top:6px;">
            <span style="font-size:11px; color:var(--muted);">Sua carga:</span>
            <input type="text" class="load-input" placeholder="Ex: 20kg" value="${cargaSalva}" onchange="salvarCarga('${ex.id}', this.value)">
          </div>
        </div>
      `;
    });
    
    html += `</div>`;
    container.innerHTML += html;
  });
}

function salvarCarga(exId, valor) {
  localStorage.setItem(`carga_${studentData.code}_${exId}`, valor);
}

// RENDERIZAR DIETA
function renderizarDieta() {
  const container = document.getElementById("dietaContainer");
  container.innerHTML = "";

  if(!studentData.refeicoes || studentData.refeicoes.length === 0) {
    container.innerHTML = "<p style='font-size:13px; color:var(--muted);'>Nenhum plano alimentar cadastrado.</p>";
    return;
  }

  studentData.refeicoes.forEach(ref => {
    container.innerHTML += `
      <div class="exercise-item">
        <div class="exercise-name" style="color:var(--gold);">${ref.titulo}</div>
        <div style="font-size:13px; color:#fff; margin-top:6px; line-height:1.4;">${ref.alimentos}</div>
      </div>
    `;
  });
}

// ABAS
function trocarAba(tabId, btn) {
  document.getElementById("treinosTab").style.display = "none";
  document.getElementById("dietaTab").style.display = "none";
  document.getElementById("iaTab").style.display = "none";

  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  
  document.getElementById(tabId).style.display = "block";
  btn.classList.add("active");
}

// ANAMNESE WHATSAPP
function enviarAnamneseWhatsApp() {
  const nome = document.getElementById("anaNome").value.trim() || "Não informado";
  const objetivo = document.getElementById("anaObjetivo").value.trim() || "Não informado";
  const nivel = document.getElementById("anaNivel").value || "Não informado";
  const frequencia = document.getElementById("anaFrequencia").value.trim() || "Não informado";
  const lesoes = document.getElementById("anaLesoes").value.trim() || "Nenhuma";
  
  const linkSeuNotebookIA = "https://notebooklm.google.com/"; 

  const textoMensagem = 
`🚨 *NOVA ANAMNESE RECEBIDA!*

👤 *Aluno:* ${nome}
🎯 *Objetivo:* ${objetivo}
🏋️ *Nível:* ${nivel}
📅 *Frequência:* ${frequencia}
⚠️ *Lesões/Observações:* ${lesoes}

🧠 *Agente de IA (Montar Treino):*
${linkSeuNotebookIA}`;

  const urlWhatsApp = `https://wa.me/5551990169026?text=${encodeURIComponent(textoMensagem)}`;
  window.open(urlWhatsApp, "_blank");
}

// CHAT IA
async function enviarMensagemIA(textoPronto = null) {
  const inputEl = document.getElementById("chatInput");
  const msgText = textoPronto || inputEl.value.trim();
  
  if(!msgText) return;

  adicionarMensagemNaTela("user", msgText);
  if(!textoPronto) inputEl.value = "";

  const systemPrompt = {
    role: "system",
    content: `Você é o Jhonata AI, assistente virtual de Educação Física e Nutrição Esportiva da Consultoria Inteligente.
    
DADOS ATUAIS DO ALUNO:
- Nome: ${studentData.clientName || 'Aluno'}
- Ficha de Treinos: ${JSON.stringify(studentData.days || [])}
- Plano Alimentar: ${JSON.stringify(studentData.refeicoes || [])}

DIRETRIZES:
1. LEITURA DE TREINOS: Para substituição de exercícios, consulte a ficha de treinos do aluno e sugira variações.
2. LEITURA DE DIETA: Para trocas de alimentos, consulte as refeições dele e faça trocas com macronutrientes equivalentes.`
  };

  chatHistory.push({ role: "user", content: msgText });
  const mensagensEnviadas = [systemPrompt, ...chatHistory.slice(-6)];

  const loadingBubble = adicionarMensagemNaTela("assistant", "⏳ Processando...");

  try {
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer SEU_API_KEY_AQUI"
      },
      body: JSON.stringify({
        model: "llama-3.3-70b-versatile",
        messages: mensagensEnviadas,
        temperature: 0.7
      })
    });

    const data = await res.json();
    const respostaIA = data.choices[0].message.content;

    loadingBubble.innerText = respostaIA;
    chatHistory.push({ role: "assistant", content: respostaIA });

  } catch(err) {
    loadingBubble.innerText = "Assistente offline no momento. Tente novamente em instantes!";
  }
}

function adicionarMensagemNaTela(remetente, texto) {
  const container = document.getElementById("chatMessages");
  const msg = document.createElement("div");
  msg.className = `chat-bubble ${remetente}`;
  msg.innerText = texto;
  container.appendChild(msg);
  container.scrollTop = container.scrollHeight;
  return msg;
}
</script>
</body>
</html>
