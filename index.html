<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultoria Esportiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #210309;
    --card: #340712;
    --card-border: #5a1120;
    --accent: #c4324f;
    --gold: #d4a02a;
    --green: #7fd68a;
    --text: #ffffff;
    --muted: #d8b3bb;
    --input-bg: #2a0710;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; padding-bottom:40px; }
  header { padding:18px 20px; border-bottom:1px solid var(--card-border); font-family:'JetBrains Mono',monospace; font-size:13px; display:flex; justify-content:space-between; align-items:center; }
  header b { color:var(--accent); }
  .wrap { max-width:600px; margin:0 auto; padding:20px 16px; }
  .card { background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:18px; margin-bottom:16px; }
  .eyebrow { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; }
  h1 { font-size:22px; font-weight:800; margin-bottom:4px; }
  p.sub { color:var(--muted); font-size:13.5px; margin-bottom:16px; }
  
  /* Abas Principais (Treino / Dieta) */
  .main-nav { display:flex; gap:10px; margin-bottom:20px; }
  .nav-btn { flex:1; background:var(--card); border:1px solid var(--card-border); color:var(--text); padding:14px; border-radius:12px; font-weight:700; font-size:15px; cursor:pointer; text-align:center; }
  .nav-btn.active { background:var(--accent); border-color:var(--accent); }

  /* Sub-tabs de Treino (Dias) */
  .tabs { display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:16px; scrollbar-width:none; }
  .tab-btn { background:var(--input-bg); border:1px solid var(--card-border); color:var(--muted); padding:10px 16px; border-radius:100px; font-size:13px; font-weight:600; white-space:nowrap; cursor:pointer; }
  .tab-btn.active { background:var(--gold); color:#210309; border-color:var(--gold); }

  /* Exercícios e Refeições */
  .ex-item { background:var(--input-bg); border:1px solid var(--card-border); border-radius:12px; padding:14px; margin-bottom:10px; }
  .ex-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
  .ex-title { font-weight:700; font-size:15px; color:#fff; }
  .ex-meta { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--gold); }
  
  .meal-title { font-weight:700; font-size:16px; color:var(--gold); margin-bottom:8px; font-family:'JetBrains Mono',monospace; }
  .meal-body { color:var(--text); font-size:14px; line-height:1.5; }

  .load-input { width:100%; background:var(--bg); border:1px solid var(--card-border); color:var(--green); padding:8px 12px; border-radius:8px; font-family:'JetBrains Mono',monospace; font-size:13px; }

  .hidden { display:none !important; }
  .loading { text-align:center; padding:40px; font-family:'JetBrains Mono',monospace; color:var(--muted); }
</style>
</head>
<body>

<header>
  <div>JHONATA <b>/ FITNESS</b></div>
  <div id="studentHeaderName" style="color:var(--gold); font-weight:700;"></div>
</header>

<div class="wrap">
  <div id="loadingState" class="loading">Carregando dados...</div>

  <!-- TELA DE ANAMNESE -->
  <div id="anamneseScreen" class="hidden">
    <div class="card">
      <div class="eyebrow">BEM-VINDO(A)</div>
      <h1>Ficha de Anamnese</h1>
      <p class="sub">Preencha os dados abaixo para iniciar seu acompanhamento.</p>
      <form id="anamneseForm">
        <label style="display:block; font-size:12px; color:var(--muted); margin-bottom:4px;">Nome Completo</label>
        <input type="text" id="anamName" required style="width:100%; background:var(--input-bg); border:1px solid var(--card-border); color:#fff; padding:10px; border-radius:8px; margin-bottom:12px;">
        
        <label style="display:block; font-size:12px; color:var(--muted); margin-bottom:4px;">Objetivo Principal</label>
        <input type="text" id="anamGoal" placeholder="Ex: Hipertrofia, Emagrecimento" required style="width:100%; background:var(--input-bg); border:1px solid var(--card-border); color:#fff; padding:10px; border-radius:8px; margin-bottom:16px;">

        <button type="submit" style="width:100%; background:var(--accent); color:#fff; border:none; padding:12px; border-radius:100px; font-weight:700; cursor:pointer;">Enviar via WhatsApp</button>
      </form>
    </div>
  </div>

  <!-- TELA PRINCIPAL -->
  <div id="appScreen" class="hidden">
    <div class="card" style="background: linear-gradient(135deg, #340712, #210309);">
      <div class="eyebrow" id="workoutEyebrow">ACOMPANHAMENTO</div>
      <h1 id="workoutTitle">Carregando...</h1>
      <p class="sub" id="billingText" style="margin-bottom:0; color:var(--gold); font-family:'JetBrains Mono',monospace; font-size:12px;"></p>
    </div>

    <!-- Navegação Principal: Treino / Dieta -->
    <div class="main-nav">
      <button class="nav-btn active" id="btnTabTreino" onclick="switchMainTab('treino')">🏋️ TREINO</button>
      <button class="nav-btn" id="btnTabDieta" onclick="switchMainTab('dieta')">🥗 DIETA</button>
    </div>

    <!-- SEÇÃO DE TREINO -->
    <div id="sectionTreino">
      <div class="tabs" id="dayTabs"></div>
      <div id="exerciseList"></div>
    </div>

    <!-- SEÇÃO DE DIETA -->
    <div id="sectionDieta" class="hidden">
      <div id="mealsList"></div>
    </div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const studentCode = urlParams.get('a') || urlParams.get('aluno');

  const loadingState = document.getElementById('loadingState');
  const anamneseScreen = document.getElementById('anamneseScreen');
  const appScreen = document.getElementById('appScreen');

  let currentData = null;

  if (!studentCode) {
    loadingState.classList.add('hidden');
    anamneseScreen.classList.remove('hidden');
  } else {
    fetch(`data/${studentCode.toLowerCase()}.json?v=${new Date().getTime()}`)
      .then(response => {
        if (!response.ok) throw new Error("Ficha não encontrada");
        return response.json();
      })
      .then(data => {
        currentData = data;
        loadingState.classList.add('hidden');
        appScreen.classList.remove('hidden');
        renderApp(data);
      })
      .catch(err => {
        console.error(err);
        loadingState.innerHTML = `<span style="color:var(--accent)">Erro: Ficha "${studentCode}" não encontrada.</span><br><br><small>Verifique se o arquivo data/${studentCode}.json existe no GitHub.</small>`;
      });
  }

  function renderApp(data) {
    document.getElementById('studentHeaderName').textContent = data.clientName || '';
    document.getElementById('workoutTitle').textContent = data.title || 'Plano de Acompanhamento';
    
    if(data.billing) {
      document.getElementById('billingText').textContent = `Mensalidade: R$ ${data.billing.valor || '80'} | Vencimento: Dia ${data.billing.dueDay || '10'}`;
    }

    renderWorkoutSection(data);
    renderDietSection(data);
  }

  function switchMainTab(tab) {
    const btnTreino = document.getElementById('btnTabTreino');
    const btnDieta = document.getElementById('btnTabDieta');
    const secTreino = document.getElementById('sectionTreino');
    const secDieta = document.getElementById('sectionDieta');

    if (tab === 'treino') {
      btnTreino.classList.add('active');
      btnDieta.classList.remove('active');
      secTreino.classList.remove('hidden');
      secDieta.classList.add('hidden');
    } else {
      btnDieta.classList.add('active');
      btnTreino.classList.remove('active');
      secDieta.classList.remove('hidden');
      secTreino.classList.add('hidden');
    }
  }

  function renderWorkoutSection(data) {
    const days = data.days || [];
    const dayTabs = document.getElementById('dayTabs');
    dayTabs.innerHTML = '';

    days.forEach((day, index) => {
      const btn = document.createElement('button');
      btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
      btn.textContent = day.title;
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadDayExercises(day);
      };
      dayTabs.appendChild(btn);
    });

    if (days.length > 0) {
      loadDayExercises(days[0]);
    }
  }

  function loadDayExercises(day) {
    const exerciseList = document.getElementById('exerciseList');
    exerciseList.innerHTML = '';

    const list = day.exercicios || day.exercises || [];

    list.forEach((ex, idx) => {
      const name = ex.nome || ex.name || 'Exercício';
      const series = ex.series || '3';
      const reps = ex.reps || ex.repsAlvo || '10';

      const div = document.createElement('div');
      div.className = 'ex-item';
      div.innerHTML = `
        <div class="ex-header">
          <div class="ex-title">${name}</div>
          <div class="ex-meta">${series}x (${reps})</div>
        </div>
        <input type="text" class="load-input" placeholder="Anotar carga (ex: 20kg)" value="${localStorage.getItem(`load_${studentCode}_${day.id}_${idx}`) || ''}" onchange="localStorage.setItem('load_${studentCode}_${day.id}_${idx}', this.value)">
      `;
      exerciseList.appendChild(div);
    });
  }

  function renderDietSection(data) {
    const mealsList = document.getElementById('mealsList');
    mealsList.innerHTML = '';

    if (data.refeicoes && data.refeicoes.length > 0) {
      data.refeicoes.forEach(ref => {
        const div = document.createElement('div');
        div.className = 'ex-item';
        div.innerHTML = `
          <div class="meal-title">${ref.titulo}</div>
          <div class="meal-body">${ref.alimentos}</div>
        `;
        mealsList.appendChild(div);
      });
    } else if (data.diet && data.diet.observacao) {
      const div = document.createElement('div');
      div.className = 'ex-item';
      div.innerHTML = `<div class="meal-body">${data.diet.observacao}</div>`;
      mealsList.appendChild(div);
    } else {
      mealsList.innerHTML = '<div class="ex-item"><div class="meal-body">Nenhuma orientação cadastrada.</div></div>';
    }
  }

  document.getElementById('anamneseForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('anamName').value;
    const goal = document.getElementById('anamGoal').value;
    const msg = `Olá! Preenchi a anamnese no app.%0A*Nome:* ${name}%0A*Objetivo:* ${goal}`;
    window.open(`https://wa.me/?text=${msg}`, '_blank');
  });
</script>
</body>
</html>
