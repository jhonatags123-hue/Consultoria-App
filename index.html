<!DOCTYPE html>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultoria Inteligente — Área do Aluno</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080103;
    --card: rgba(36, 4, 12, 0.92);
    --border: #6e1327;
    --accent: #ff2a2a;
    --gold: #ffcc00;
    --green: #25d366;
    --text: #ffffff;
    --muted: #f0c2cd;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: radial-gradient(circle at top, #3b0612 0%, #080103 85%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    padding: 16px;
    max-width: 500px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* LOGIN & MODAL CONTAINER */
  .card {
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 2px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }
  
  .title { font-size: 20px; font-weight: 900; color: #fff; margin-bottom: 12px; text-transform: uppercase; }
  
  input, select, textarea {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(15, 2, 5, 0.85);
    color: #fff;
    font-size: 14px;
    margin-bottom: 12px;
    outline: none;
  }

  .btn {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    font-weight: 900;
    font-size: 14px;
    text-align: center;
    text-decoration: none;
    display: block;
    cursor: pointer;
    border: none;
    transition: all 0.2s ease;
    text-transform: uppercase;
  }
  .btn-primary {
    background: linear-gradient(90deg, #ff2a2a 0%, #b80d0d 100%);
    color: #fff;
    box-shadow: 0 4px 20px rgba(255, 42, 42, 0.5);
  }

  /* CHAT DA IA COM CHIPS */
  .chat-box {
    display: flex;
    flex-direction: column;
    height: 380px;
    background: rgba(15, 2, 5, 0.9);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px;
  }
  
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-right: 4px;
    margin-bottom: 10px;
  }

  .chat-bubble {
    max-width: 85%;
    padding: 12px 14px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.4;
  }
  .chat-bubble.user {
    background: var(--border);
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 2px;
  }
  .chat-bubble.assistant {
    background: rgba(56, 6, 18, 0.9);
    border: 1px solid var(--gold);
    color: #fff;
    align-self: flex-start;
    border-bottom-left-radius: 2px;
  }

  /* CHIPS DE PERGUNTAS RÁPIDAS */
  .chat-chips-container {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 6px 0;
    margin-bottom: 8px;
    scrollbar-width: none;
  }
  .chat-chips-container::-webkit-scrollbar { display: none; }
  
  .chip-btn {
    background: rgba(110, 19, 39, 0.6);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    padding: 6px 12px;
    border-radius: 20px;
    white-space: nowrap;
    cursor: pointer;
  }
  .chip-btn:active { background: var(--accent); color: #fff; }

  .chat-input-row { display: flex; gap: 8px; }
  .chat-input-row input { margin-bottom: 0; }
</style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="loginSection" class="card">
    <div class="title">🔑 Área do Aluno</div>
    <input type="text" id="userCodeInput" placeholder="Digite seu código ou nome de usuário">
    <button class="btn btn-primary" onclick="fazerLogin()">ENTRAR NO APLICATIVO</button>
  </div>

  <!-- PAINEL DO ALUNO (OCULTO ATÉ O LOGIN) -->
  <div id="appSection" style="display:none; display:flex; flex-direction:column; gap:16px;">
    
    <!-- CABEÇALHO DO ALUNO -->
    <div class="card">
      <div class="title" id="studentWelcome">Bem-vindo(a)!</div>
      <p style="font-size:13px; color:var(--muted);" id="protocolTitle">Protocolo de Treino & Nutrição</p>
    </div>

    <!-- CHAT COM JHONATA AI -->
    <div class="card">
      <div class="title" style="color:var(--gold); font-size:16px;">🤖 JHONATA AI — ASSISTENTE VIRTUAL</div>
      
      <div class="chat-box">
        <div class="chat-messages" id="chatMessages">
          <div class="chat-bubble assistant">
            Olá! Sou o Jhonata AI. Tenho acesso completo à sua ficha de treinos e dieta. Como posso te ajudar hoje?
          </div>
        </div>

        <!-- PERGUNTAS RÁPIDAS (CHIPS) -->
        <div class="chat-chips-container">
          <button class="chip-btn" onclick="enviarMensagemIA('Como posso substituir o arroz da minha refeição hoje?')">
            💡 Trocar arroz
          </button>
          <button class="chip-btn" onclick="enviarMensagemIA('A academia está cheia, qual exercício substitui o primeiro do meu treino?')">
            🏋️ Substituir exercício
          </button>
          <button class="chip-btn" onclick="enviarMensagemIA('O que posso comer de pré-treino rápido 30 minutos antes de ir treinar?')">
            ⚡ Pré-treino rápido (<1h)
          </button>
        </div>

        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="Pergunte algo sobre seu treino ou dieta..." onkeypress="if(event.key==='Enter') enviarMensagemIA()">
          <button class="btn btn-primary" style="width: auto; padding: 0 18px;" onclick="enviarMensagemIA()">➔</button>
        </div>
      </div>
    </div>

  </div>

<script>
let studentData = {};
let chatHistory = [];

// FUNCIONALIDADE DE LOGIN
async function fazerLogin() {
  const code = document.getElementById("userCodeInput").value.trim().toLowerCase();
  if(!code) return alert("Digite seu código de aluno!");

  try {
    const res = await fetch(`./data/${code}.json`);
    if(!res.ok) throw new Error("Aluno não encontrado");
    
    studentData = await res.json();
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("appSection").style.display = "flex";
    
    document.getElementById("studentWelcome").innerText = `Olá, ${studentData.clientName || code}!`;
    if(studentData.title) document.getElementById("protocolTitle").innerText = studentData.title;

  } catch(e) {
    alert("Código ou usuário não encontrado! Verifique se digitou corretamente.");
  }
}

// INTEGRAÇÃO COMPLETA DA IA COM HISTÓRICO E CONTEXTO
async function enviarMensagemIA(textoPronto = null) {
  const inputEl = document.getElementById("chatInput");
  const msgText = textoPronto || inputEl.value.trim();
  
  if(!msgText) return;

  adicionarMensagemNaTela("user", msgText);
  if(!textoPronto) inputEl.value = "";

  // System Prompt Inteligente
  const systemPrompt = {
    role: "system",
    content: `Você é o Jhonata AI, assistente virtual de Educação Física e Nutrição Esportiva da Consultoria Inteligente.
    
DADOS ATUAIS DO ALUNO:
- Nome: ${studentData.clientName || 'Aluno'}
- Ficha de Treinos: ${JSON.stringify(studentData.days || [])}
- Plano Alimentar: ${JSON.stringify(studentData.refeicoes || [])}

DIRETRIZES:
1. LEITURA DE TREINOS: Para substituição de exercícios, consulte a ficha de treinos do aluno e sugira variações com mesmo padrão de movimento.
2. LEITURA DE DIETA: Para trocas de alimentos, consulte as refeições dele e faça trocas com macronutrientes equivalentes.
3. PRÉ/PÓS-TREINO: Dê sugestões de rápida digestão (carboidratos simples) para refeições em menos de 1h antes do treino.
4. Mantenha o contexto recente. Responda de forma objetiva, direta e motivadora.`
  };

  chatHistory.push({ role: "user", content: msgText });
  const mensagensEnviadas = [systemPrompt, ...chatHistory.slice(-6)];

  const loadingBubble = adicionarMensagemNaTela("assistant", "⏳ Processando...");

  try {
    // Chamada para a API (exemplo estruturado com modelo Groq / OpenAI)
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer SEU_API_KEY_AQUI"
      },
      body: JSON.stringify({
        model: "llama-3.3-70b-versatile",
        messages: mensagensEnviadas,
        temperature: 0.7
      })
    });

    const data = await res.json();
    const respostaIA = data.choices[0].message.content;

    loadingBubble.innerText = respostaIA;
    chatHistory.push({ role: "assistant", content: respostaIA });

  } catch(err) {
    console.error(err);
    loadingBubble.innerText = "Assistente offline no momento. Tente novamente em alguns instantes!";
  }
}

function adicionarMensagemNaTela(remetente, texto) {
  const container = document.getElementById("chatMessages");
  const msg = document.createElement("div");
  msg.className = `chat-bubble ${remetente}`;
  msg.innerText = texto;
  container.appendChild(msg);
  container.scrollTop = container.scrollHeight;
  return msg;
}
</script>
</body>
</html>
