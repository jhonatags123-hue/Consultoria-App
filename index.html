<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultoria Esportiva</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #210309; --card: #340712; --border: #5a1120; --accent: #c4324f; --gold: #d4a02a; --text: #fff; --muted: #d8b3bb; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; padding:16px; max-width:500px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
  h1 { font-size:20px; font-weight:800; color:var(--text); }
  .sub { color:var(--gold); font-size:12px; margin-top:4px; font-weight:600; }
  
  /* Menu Principal */
  .menu { display:flex; gap:6px; margin-bottom:16px; }
  .menu-btn { flex:1; padding:10px 4px; background:var(--card); border:1px solid var(--border); color:var(--text); font-weight:700; font-size:12px; border-radius:10px; cursor:pointer; text-align:center; }
  .menu-btn.active { background:var(--accent); border-color:var(--accent); }

  /* Submenus / Dias */
  .days { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px; }
  .day-btn { padding:8px 14px; background:#2a0710; border:1px solid var(--border); color:var(--muted); font-size:12px; font-weight:600; border-radius:20px; white-space:nowrap; cursor:pointer; }
  .day-btn.active { background:var(--gold); color:#210309; border-color:var(--gold); }

  /* Lista de Itens */
  .item { background:#2a0710; border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:8px; }
  .item-title { font-weight:700; font-size:14px; color:#fff; }
  .item-meta { color:var(--gold); font-size:12px; font-weight:600; margin-top:2px; }
  .item-body { color:var(--text); font-size:13px; line-height:1.4; margin-top:4px; }
  .input-load { width:100%; margin-top:8px; background:var(--bg); border:1px solid var(--border); color:#7fd68a; padding:6px 10px; border-radius:6px; font-size:12px; }

  /* Chat da IA */
  .chat-box { background:#2a0710; border:1px solid var(--border); border-radius:12px; height:320px; padding:12px; overflow-y:auto; margin-bottom:10px; display:flex; flex-direction:column; gap:10px; }
  .msg { padding:10px 12px; border-radius:10px; font-size:13px; line-height:1.4; max-width:85%; word-break:break-word; }
  .msg-user { background:var(--accent); color:#fff; align-self:flex-end; }
  .msg-ai { background:var(--card); border:1px solid var(--border); color:var(--text); align-self:flex-start; }
  .chat-input-row { display:flex; gap:8px; }
  .chat-input { flex:1; background:var(--card); border:1px solid var(--border); color:#fff; padding:10px 12px; border-radius:8px; font-size:13px; }
  .chat-btn { background:var(--gold); color:#210309; border:none; padding:10px 16px; border-radius:8px; font-weight:700; cursor:pointer; }

  .hidden { display:none !important; }
  .center { text-align:center; padding:30px; color:var(--muted); }
</style>
</head>
<body>

<div id="statusMsg" class="center">Carregando dados...</div>

<div id="mainContent" class="hidden">
  <div class="card">
    <h1 id="clientName">Consultoria</h1>
    <div class="sub" id="billingInfo"></div>
  </div>

  <div class="menu">
    <button class="menu-btn active" id="btnTreino" onclick="showTab('treino')">🏋️ TREINO</button>
    <button class="menu-btn" id="btnDieta" onclick="showTab('dieta')">🥗 DIETA</button>
    <button class="menu-btn" id="btnIa" onclick="showTab('ia')">🤖 ASSISTENTE</button>
  </div>

  <div id="tabTreino">
    <div class="days" id="daysList"></div>
    <div id="exercisesList"></div>
  </div>

  <div id="tabDieta" class="hidden">
    <div id="mealsList"></div>
  </div>

  <!-- ABA DA IA -->
  <div id="tabIa" class="hidden">
    <div class="chat-box" id="chatBox">
      <div class="msg msg-ai">Olá! Sou o assistente virtual do Personal Jhonata. Como posso te ajudar com dúvidas de treino, execução ou trocas na dieta hoje?</div>
    </div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" class="chat-input" placeholder="Ex: Posso trocar arroz por batata?">
      <button class="chat-btn" onclick="sendAiMessage()">Enviar</button>
    </div>
  </div>
</div>

<script>
  // CHAVE DA API CONFIGURADA
  const GEMINI_API_KEY = "AQ.Ab8RN6I4RpbzJYvCf8p76u63928McOLftJTOF9R7Ar8bNjws1A";

  const params = new URLSearchParams(window.location.search);
  const code = params.get('a') || params.get('aluno');

  if (!code) {
    document.getElementById('statusMsg').innerHTML = 'Acesse com o link do aluno.<br><small>Ex: index.html?a=erick</small>';
  } else {
    fetch(`data/${code.toLowerCase()}.json?t=${Date.now()}`)
      .then(res => res.json())
      .then(data => {
        document.getElementById('statusMsg').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        
        document.getElementById('clientName').textContent = data.clientName || 'Aluno';
        if(data.billing) {
          document.getElementById('billingInfo').textContent = `Mensalidade: R$ ${data.billing.valor || '80'} | Vencimento: Dia ${data.billing.dueDay || '10'}`;
        }

        setupWorkout(data.days || []);
        setupDiet(data.refeicoes || []);
      })
      .catch(err => {
        document.getElementById('statusMsg').innerHTML = `<b style="color:var(--accent)">Erro ao carregar data/${code}.json</b><br><small>Verifique se o arquivo existe no GitHub.</small>`;
      });
  }

  function showTab(tab) {
    document.getElementById('tabTreino').classList.add('hidden');
    document.getElementById('tabDieta').classList.add('hidden');
    document.getElementById('tabIa').classList.add('hidden');
    
    document.getElementById('btnTreino').classList.remove('active');
    document.getElementById('btnDieta').classList.remove('active');
    document.getElementById('btnIa').classList.remove('active');

    if(tab === 'treino') {
      document.getElementById('tabTreino').classList.remove('hidden');
      document.getElementById('btnTreino').classList.add('active');
    } else if(tab === 'dieta') {
      document.getElementById('tabDieta').classList.remove('hidden');
      document.getElementById('btnDieta').classList.add('active');
    } else {
      document.getElementById('tabIa').classList.remove('hidden');
      document.getElementById('btnIa').classList.add('active');
    }
  }

  function setupWorkout(days) {
    const daysList = document.getElementById('daysList');
    daysList.innerHTML = '';
    days.forEach((day, index) => {
      const btn = document.createElement('button');
      btn.className = `day-btn ${index === 0 ? 'active' : ''}`;
      btn.textContent = day.title;
      btn.onclick = () => {
        document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderExercises(day);
      };
      daysList.appendChild(btn);
    });
    if(days.length > 0) renderExercises(days[0]);
  }

  function renderExercises(day) {
    const list = document.getElementById('exercisesList');
    list.innerHTML = '';
    (day.exercicios || []).forEach((ex, idx) => {
      const key = `c_${code}_${day.id}_${idx}`;
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `
        <div class="item-title">${ex.nome}</div>
        <div class="item-meta">${ex.series}x (${ex.reps})</div>
        <input class="input-load" placeholder="Carga (ex: 20kg)" value="${localStorage.getItem(key) || ''}" onchange="localStorage.setItem('${key}', this.value)">
      `;
      list.appendChild(div);
    });
  }

  function setupDiet(refeicoes) {
    const list = document.getElementById('mealsList');
    list.innerHTML = '';
    refeicoes.forEach(ref => {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `
        <div class="item-title" style="color:var(--gold);">${ref.titulo}</div>
        <div class="item-body">${ref.alimentos}</div>
      `;
      list.appendChild(div);
    });
  }

  async function sendAiMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if(!text) return;

    const chatBox = document.getElementById('chatBox');

    const userMsg = document.createElement('div');
    userMsg.className = 'msg msg-user';
    userMsg.textContent = text;
    chatBox.appendChild(userMsg);
    input.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;

    const loadingMsg = document.createElement('div');
    loadingMsg.className = 'msg msg-ai';
    loadingMsg.textContent = 'Pensando...';
    chatBox.appendChild(loadingMsg);
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [{
              text: `Você é o Assistente Virtual Oficial do Personal Trainer Jhonata.
Sua função é tirar dúvidas de alunos sobre o treino e a dieta com respostas diretas, motivadoras e objetivas.

REGRAS RÍGIDAS DE EQUIVALÊNCIA ALIMENTAR:
Ao sugerir trocas de alimentos, utilize EXATAMENTE as proporções abaixo como referência:

1. CARBOIDRATOS (Equivalência aproximada para ~25g de Carbo):
   - 100g de Arroz branco/integral cozido
   - = 120g de Batata doce / Batata inglesa cozida
   - = 100g de Mandioca / Aipim cozido
   - = 100g de Macarrão cozido
   - = 2 fatias de Pão de forma (integral ou tradicional)
   - = 30g de Aveia em flocos

2. PROTEÍNAS (Equivalência aproximada para ~20g a 25g de Proteína):
   - 100g de Peito de frango grelhado
   - = 100g de Carne vermelha magra (Patinho, Músculo)
   - = 120g de Filet de peixe (Tilápia, Merluza)
   - = 3 a 4 Ovos inteiros grandes
   - = 30g de Whey Protein (1 scoop padrão)

3. GORDURAS (Equivalência aproximada para ~10g de Gordura):
   - 10g de Azeite de oliva (1 colher de sopa rasa)
   - = 15g de Pasta de amendoim
   - = 15g de Castanhas / Nozes / Amêndoas

REGRAS DE RESPOSTA:
- Quando o aluno perguntar sobre trocar um alimento, calcule a quantidade equivalente com base na lista acima.
- Se o assunto for dores graves, lesões ou mudança total no plano, oriente a chamar o Jhonata no WhatsApp.

Pergunta do aluno: ${text}`
            }]
          }]
        })
      });

      const data = await response.json();
      const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Não consegui responder agora. Tente novamente!";
      loadingMsg.textContent = reply;
    } catch(err) {
      loadingMsg.textContent = "Ops! Ocorreu um erro ao consultar a IA. Verifique se a sua chave de API está ativa.";
    }
    chatBox.scrollTop = chatBox.scrollHeight;
  }
</script>
</body>
</html>
