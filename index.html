<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultoria Esportiva — Jhonata</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- OneSignal SDK -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "149311da-3e88-410f-a9b3-56a098d89b1c",
    });
  });
</script>

<style>
  :root { --bg: #210309; --card: #340712; --border: #5a1120; --accent: #c4324f; --gold: #d4a02a; --text: #fff; --muted: #d8b3bb; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; padding:16px; max-width:500px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; justify-content:center; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:14px; }
  h1 { font-size:22px; font-weight:800; color:var(--text); text-align:center; }
  .sub { color:var(--gold); font-size:12px; margin-top:4px; font-weight:600; text-align:center; }
  
  .login-box { display:flex; flex-direction:column; gap:12px; margin-top:16px; }
  .input-field { width:100%; background:#2a0710; border:1px solid var(--border); color:#fff; padding:12px; border-radius:8px; font-size:14px; }
  select.input-field { color:#fff; cursor:pointer; }
  textarea.input-field { resize:none; font-family:'Inter',sans-serif; }
  .btn-login { width:100%; background:var(--accent); color:#fff; border:none; padding:12px; border-radius:8px; font-weight:700; font-size:15px; cursor:pointer; margin-top:8px; }
  .btn-header { background:transparent; border:1px solid var(--border); color:var(--muted); padding:4px 8px; border-radius:6px; font-size:11px; cursor:pointer; }
  .error-msg { color:var(--accent); font-size:12px; text-align:center; margin-top:8px; }

  .progress-bar-bg { width:100%; background:#2a0710; border:1px solid var(--border); height:8px; border-radius:4px; margin:12px 0; overflow:hidden; }
  .progress-bar-fill { width:14%; background:var(--gold); height:100%; transition:width 0.3s ease; }
  .step-counter { font-size:11px; color:var(--gold); font-weight:700; text-align:right; margin-bottom:8px; }

  .header-app { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .header-actions { display:flex; gap:6px; }
  .menu { display:flex; gap:4px; margin-bottom:16px; }
  .menu-btn { flex:1; padding:10px 2px; background:var(--card); border:1px solid var(--border); color:var(--text); font-weight:700; font-size:11px; border-radius:10px; cursor:pointer; text-align:center; }
  .menu-btn.active { background:var(--accent); border-color:var(--accent); }

  .days { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px; scrollbar-width:none; }
  .day-btn { padding:8px 14px; background:#2a0710; border:1px solid var(--border); color:var(--muted); font-size:12px; font-weight:600; border-radius:20px; white-space:nowrap; cursor:pointer; }
  .day-btn.active { background:var(--gold); color:#210309; border-color:var(--gold); }

  .item { background:#2a0710; border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:8px; }
  .item-title { font-weight:700; font-size:14px; color:#fff; }
  .item-meta { color:var(--gold); font-size:12px; font-weight:600; margin-top:2px; }
  
  .inputs-row { display:flex; gap:8px; margin-top:8px; }
  .input-load { flex:1; background:var(--bg); border:1px solid var(--border); color:#7fd68a; padding:8px 10px; border-radius:6px; font-size:12px; }

  .chat-box { background:#2a0710; border:1px solid var(--border); border-radius:12px; height:300px; padding:12px; overflow-y:auto; margin-bottom:10px; display:flex; flex-direction:column; gap:10px; }
  .msg { padding:10px 12px; border-radius:10px; font-size:13px; line-height:1.4; max-width:85%; word-break:break-word; }
  .msg-user { background:var(--accent); color:#fff; align-self:flex-end; }
  .msg-ai { background:var(--card); border:1px solid var(--border); color:var(--text); align-self:flex-start; }

  .chat-input-row { display:flex; gap:8px; }
  .chat-input { flex:1; background:var(--card); border:1px solid var(--border); color:#fff; padding:10px 12px; border-radius:8px; font-size:13px; }
  .chat-btn { background:var(--gold); color:#210309; border:none; padding:10px 16px; border-radius:8px; font-weight:700; cursor:pointer; }

  .label-fdb { display:block; font-size:12px; color:var(--gold); font-weight:700; margin-bottom:4px; }
  .hidden { display:none !important; }
</style>
</head>
<body>

<div id="anamneseScreen" class="card hidden">
  <h1>ANAMNESE NUTRICIONAL & TREINO</h1>
  <div class="sub">Preencha com atenção para a montagem do seu protocolo</div>
  
  <div class="progress-bar-bg">
    <div id="progressBar" class="progress-bar-fill"></div>
  </div>
  <div id="stepCounter" class="step-counter">Etapa 1 de 7</div>

  <form onsubmit="event.preventDefault();" class="login-box">
    <div id="anamStep1">
      <label class="label-fdb">1. Nome Completo</label>
      <input type="text" id="anamNome" class="input-field" placeholder="Ex: Lucas Andrade" required>

      <label class="label-fdb" style="margin-top:8px;">Qual é o seu E-mail?</label>
      <input type="email" id="anamEmail" class="input-field" placeholder="Ex: lucas@email.com" required>

      <label class="label-fdb" style="margin-top:8px;">Data de Nascimento</label>
      <input type="text" id="anamNasc" class="input-field" placeholder="DD/MM/AAAA" required>

      <div style="display:flex; gap:8px; margin-top:8px;">
        <div style="flex:1;">
          <label class="label-fdb">Peso (kg)</label>
          <input type="text" id="anamPeso" class="input-field" placeholder="Ex: 75 kg" required>
        </div>
        <div style="flex:1;">
          <label class="label-fdb">Altura (m)</label>
          <input type="text" id="anamAltura" class="input-field" placeholder="Ex: 1.75 m" required>
        </div>
      </div>
      <button type="button" class="btn-login" onclick="nextAnamStep(2)">Avançar ➔</button>
    </div>

    <div id="anamStep2" class="hidden">
      <label class="label-fdb">2. O que te motivou a buscar ajuda nutricional?</label>
      <input type="text" id="anamMotivacao" class="input-field" placeholder="Ex: Quero melhorar a estética" required>
      <label class="label-fdb" style="margin-top:8px;">Qual é o seu objetivo principal?</label>
      <select id="anamObjetivo" class="input-field" required>
        <option value="Hipertrofia / Ganho de Massa">Hipertrofia / Ganho de Massa Muscular</option>
        <option value="Emagrecimento / Perda de Gordura">Emagrecimento / Perda de Gordura</option>
      </select>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button type="button" class="btn-login" style="background:#2a0710; border:1px solid var(--border);" onclick="nextAnamStep(1)">⬅️ Voltar</button>
        <button type="button" class="btn-login" onclick="nextAnamStep(3)">Avançar ➔</button>
      </div>
    </div>

    <div id="anamStep3" class="hidden">
      <label class="label-fdb">3. Quantas refeições por dia?</label>
      <input type="text" id="anamNumRefeicoes" class="input-field" placeholder="Ex: 3 a 4">
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button type="button" class="btn-login" style="background:#2a0710; border:1px solid var(--border);" onclick="nextAnamStep(2)">⬅️ Voltar</button>
        <button type="button" class="btn-login" onclick="nextAnamStep(4)">Avançar ➔</button>
      </div>
    </div>

    <div id="anamStep4" class="hidden">
      <label class="label-fdb">4. Horário de treino e rotina:</label>
      <input type="text" id="anamHorarioTreino" class="input-field" placeholder="Ex: 18h">
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button type="button" class="btn-login" style="background:#2a0710; border:1px solid var(--border);" onclick="nextAnamStep(3)">⬅️ Voltar</button>
        <button type="button" class="btn-login" onclick="nextAnamStep(5)">Avançar ➔</button>
      </div>
    </div>

    <div id="anamStep5" class="hidden">
      <label class="label-fdb">5. Alimentos preferidos:</label>
      <textarea id="anamGostos" class="input-field" rows="2" placeholder="Ex: Frango, arroz..."></textarea>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button type="button" class="btn-login" style="background:#2a0710; border:1px solid var(--border);" onclick="nextAnamStep(4)">⬅️ Voltar</button>
        <button type="button" class="btn-login" onclick="nextAnamStep(6)">Avançar ➔</button>
      </div>
    </div>

    <div id="anamStep6" class="hidden">
      <label class="label-fdb">6. Medicamentos ou suplementos:</label>
      <input type="text" id="anamMedicamentos" class="input-field" placeholder="Ex: Creatina">
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button type="button" class="btn-login" style="background:#2a0710; border:1px solid var(--border);" onclick="nextAnamStep(5)">⬅️ Voltar</button>
        <button type="button" class="btn-login" onclick="nextAnamStep(7)">Avançar ➔</button>
      </div>
    </div>

    <div id="anamStep7" class="hidden">
      <label class="label-fdb">7. Rotina no final de semana:</label>
      <textarea id="anamFimDeSemana" class="input-field" rows="2" placeholder="Ex: Livre no sábado"></textarea>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button type="button" class="btn-login" style="background:#2a0710; border:1px solid var(--border);" onclick="nextAnamStep(6)">⬅️ Voltar</button>
        <button type="button" class="btn-login" style="background:var(--gold); color:#000;" onclick="sendAnamneseAppDirect()">🚀 ENVIAR ANAMNESE AGORA</button>
      </div>
    </div>
  </form>
</div>

<div id="loginScreen" class="card">
  <h1>JHONATA CONSULTORIA</h1>
  <div class="sub">Acesse sua área exclusiva</div>
  
  <form onsubmit="handleLogin(event)" class="login-box">
    <input type="text" id="loginUser" class="input-field" placeholder="Usuário (ex: erick ou jhonata)" required>
    <input type="password" id="loginPass" class="input-field" placeholder="Senha" required>
    <button type="submit" class="btn-login">ENTRAR</button>
  </form>
  <div id="loginError" class="error-msg hidden"></div>
</div>

<div id="mainContent" class="hidden">
  <div class="card">
    <div class="header-app">
      <h1 id="clientName">Consultoria</h1>
      <div class="header-actions">
        <button class="btn-header" onclick="solicitarPermissaoPush()">🔔 Notificações</button>
        <button class="btn-header" onclick="logout()">Sair</button>
      </div>
    </div>
    <div class="sub" id="billingInfo"></div>
  </div>

  <div class="menu">
    <button class="menu-btn active" id="btnTreino" onclick="showTab('treino')">🏋️ TREINO</button>
    <button class="menu-btn" id="btnDieta" onclick="showTab('dieta')">🥗 DIETA</button>
    <button class="menu-btn" id="btnIa" onclick="showTab('ia')">🤖 ASSISTENTE</button>
  </div>

  <div id="tabTreino">
    <div class="days" id="daysList"></div>
    <div id="exercisesList"></div>
  </div>

  <div id="tabDieta" class="hidden">
    <div id="mealsList"></div>
  </div>

  <div id="tabIa" class="hidden">
    <div class="chat-box" id="chatBox">
      <div class="msg msg-ai">Olá! Sou o assistente do Personal Jhonata. Como posso te ajudar hoje?</div>
    </div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" class="chat-input" placeholder="Ex: Substituir arroz no almoço">
      <button class="chat-btn" onclick="sendAiMessage()">Enviar</button>
    </div>
  </div>
</div>

<script>
  const BACKEND_URL = "https://consultoria-backend-kbqi.onrender.com";
  const ADMIN_USER = "jhonata";
  const ADMIN_PASS = "0304";

  let currentData = null;

  window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    if (params.get('modo') === 'anamnese') {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('anamneseScreen').classList.remove('hidden');
    }
  };

  function vincularPushUser(userId) {
    OneSignalDeferred.push(function(OneSignal) {
      OneSignal.login(userId);
    });
  }

  function solicitarPermissaoPush() {
    Notification.requestPermission().then(function(permission) {
      if (permission === "granted") {
        alert("🔔 Notificações ativadas com sucesso!");
        OneSignalDeferred.push(function(OneSignal) {
          OneSignal.Notifications.requestPermission();
        });
      }
    });
  }

  function nextAnamStep(step) {
    for (let i = 1; i <= 7; i++) document.getElementById(`anamStep${i}`).classList.add('hidden');
    document.getElementById(`anamStep${step}`).classList.remove('hidden');
    document.getElementById('progressBar').style.width = `${(step/7)*100}%`;
    document.getElementById('stepCounter').textContent = `Etapa ${step} de 7`;
  }

  async function handleLogin(e) {
    e.preventDefault();
    const user = document.getElementById('loginUser').value.trim().toLowerCase();
    const pass = document.getElementById('loginPass').value.trim();
    const errorDiv = document.getElementById('loginError');

    if (user === ADMIN_USER && pass === ADMIN_PASS) {
      localStorage.setItem('logged_user', ADMIN_USER);
      vincularPushUser(ADMIN_USER);
      window.location.href = "admin.html";
      return;
    }

    try {
      const res = await fetch(`${BACKEND_URL}/api/aluno/${user}`);
      if (!res.ok) throw new Error();
      const data = await res.json();

      localStorage.setItem('logged_user', user);
      vincularPushUser(user);
      loadStudentData(data);
    } catch (err) {
      errorDiv.textContent = "Usuário não encontrado no banco de dados.";
      errorDiv.classList.remove('hidden');
    }
  }

  function loadStudentData(data) {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('anamneseScreen').classList.add('hidden');
    document.getElementById('mainContent').classList.remove('hidden');

    currentData = data;
    document.getElementById('clientName').textContent = data.clientName || 'Aluno';
    setupWorkout(data.days || []);
    setupDiet(data.refeicoes || []);
  }

  function setupWorkout(days) {
    const daysList = document.getElementById('daysList');
    daysList.innerHTML = '';
    days.forEach((day, index) => {
      const btn = document.createElement('button');
      btn.className = `day-btn ${index === 0 ? 'active' : ''}`;
      btn.textContent = day.title;
      btn.onclick = () => {
        document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderExercises(day, index);
      };
      daysList.appendChild(btn);
    });
    if(days.length > 0) renderExercises(days[0], 0);
  }

  function renderExercises(day, dayIdx) {
    const list = document.getElementById('exercisesList');
    list.innerHTML = '';
    const user = localStorage.getItem('logged_user');

    (day.exercicios || []).forEach((ex, idx) => {
      const keyLoad = `c_${user}_${dayIdx}_${idx}`;
      const keyReps = `r_${user}_${dayIdx}_${idx}`;

      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `
        <div class="item-title">${ex.nome}</div>
        <div class="item-meta">${ex.series}x (${ex.reps})</div>
        <div class="inputs-row">
          <input class="input-load" placeholder="Carga (ex: 20kg)" value="${localStorage.getItem(keyLoad) || ''}" onchange="localStorage.setItem('${keyLoad}', this.value)">
          <input class="input-load" placeholder="Reps (ex: 10)" value="${localStorage.getItem(keyReps) || ''}" onchange="localStorage.setItem('${keyReps}', this.value)">
        </div>
      `;
      list.appendChild(div);
    });
  }

  function setupDiet(refeicoes) {
    const list = document.getElementById('mealsList');
    list.innerHTML = '';
    (refeicoes || []).forEach(ref => {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `<div class="item-title" style="color:var(--gold);">${ref.titulo}</div><div>${ref.alimentos}</div>`;
      list.appendChild(div);
    });
  }

  function logout() { localStorage.removeItem('logged_user'); location.reload(); }

  function showTab(tab) {
    document.getElementById('tabTreino').classList.add('hidden');
    document.getElementById('tabDieta').classList.add('hidden');
    document.getElementById('tabIa').classList.add('hidden');

    if(tab === 'treino') document.getElementById('tabTreino').classList.remove('hidden');
    else if(tab === 'dieta') document.getElementById('tabDieta').classList.remove('hidden');
    else document.getElementById('tabIa').classList.remove('hidden');
  }
</script>
</body>
</html>
