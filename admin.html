<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Personal — Jhonata</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<!-- Biblioteca para Gráficos -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root { --bg: #140206; --card: #27050d; --border: #4a0d1a; --accent: #c4324f; --gold: #d4a02a; --green: #7fd68a; --text: #fff; --muted: #d8b3bb; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; padding:16px; max-width:800px; margin:0 auto; padding-bottom:50px; }
  
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:12px; }
  h1 { font-size:20px; font-weight:800; color:var(--text); }
  .btn-logout { background:transparent; border:1px solid var(--border); color:var(--muted); padding:6px 12px; border-radius:6px; font-size:12px; cursor:pointer; }
  
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px; }
  .label-title { font-size:11px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px; }
  
  select, input { width:100%; background:#1a0308; border:1px solid var(--border); color:#fff; padding:10px 12px; border-radius:8px; font-size:13px; margin-bottom:12px; }
  
  /* Tabs do Admin */
  .admin-nav { display:flex; gap:8px; margin-bottom:16px; }
  .nav-btn { flex:1; padding:10px; background:var(--card); border:1px solid var(--border); color:var(--muted); font-weight:700; font-size:12px; border-radius:8px; cursor:pointer; text-align:center; }
  .nav-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  /* Cards de Conteúdo */
  .item-box { background:#1a0308; border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px; }
  .item-header { display:flex; justify-content:space-between; align-items:center; }
  .item-title { font-weight:700; font-size:14px; color:#fff; }
  .item-meta { color:var(--gold); font-size:12px; font-weight:600; }
  .item-body { font-size:13px; color:var(--text); margin-top:6px; line-height:1.4; }
  
  .chart-container { position:relative; width:100%; height:250px; margin-top:10px; }
  .hidden { display:none !important; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Painel do Personal</h1>
    <div style="font-size:12px; color:var(--gold);">Gestão de Alunos & Cargas</div>
  </div>
  <button class="btn-logout" onclick="logoutAdmin()">Sair</button>
</header>

<!-- SELEÇÃO DE ALUNO -->
<div class="card">
  <div class="label-title">Selecione o Aluno</div>
  <select id="studentSelect" onchange="loadStudentOverview()">
    <option value="erick">Erick</option>
    <option value="leonardo">Leonardo</option>
    <option value="otavio">Otavio</option>
  </select>
</div>

<!-- NAVEGAÇÃO INTERNA DO ALUNO -->
<div class="admin-nav">
  <button class="nav-btn active" id="btnOverviewTreino" onclick="switchAdminTab('treino')">🏋️ Treino</button>
  <button class="nav-btn" id="btnOverviewDieta" onclick="switchAdminTab('dieta')">🥗 Dieta</button>
  <button class="nav-btn" id="btnOverviewGrafico" onclick="switchAdminTab('grafico')">📈 Progresso de Carga</button>
</div>

<!-- CONTEÚDO: TREINOS DO ALUNO -->
<div id="tabAdminTreino">
  <div id="workoutDetails" class="card">
    <div class="label-title">Ficha de Treino Cadastrada</div>
    <div id="workoutContent">Carregando treino...</div>
  </div>
</div>

<!-- CONTEÚDO: DIETA DO ALUNO -->
<div id="tabAdminDieta" class="hidden">
  <div id="dietDetails" class="card">
    <div class="label-title">Plano Alimentar Cadastrado</div>
    <div id="dietContent">Carregando dieta...</div>
  </div>
</div>

<!-- CONTEÚDO: GRÁFICO DE CARGAS -->
<div id="tabAdminGrafico" class="hidden">
  <div class="card">
    <div class="label-title">Evolução de Cargas Registradas</div>
    <select id="exerciseSelect" onchange="updateChart()">
      <option value="">Selecione um exercício...</option>
    </select>
    <div class="chart-container">
      <canvas id="loadChart"></canvas>
    </div>
  </div>
</div>

<script>
  let currentStudentData = null;
  let chartInstance = null;

  // Trava de segurança do Painel Admin
  if (localStorage.getItem('logged_user') !== 'admin') {
    window.location.href = "index.html";
  }

  function logoutAdmin() {
    localStorage.removeItem('logged_user');
    window.location.href = "index.html";
  }

  window.onload = () => {
    loadStudentOverview();
  };

  function switchAdminTab(tab) {
    document.getElementById('tabAdminTreino').classList.add('hidden');
    document.getElementById('tabAdminDieta').classList.add('hidden');
    document.getElementById('tabAdminGrafico').classList.add('hidden');

    document.getElementById('btnOverviewTreino').classList.remove('active');
    document.getElementById('btnOverviewDieta').classList.remove('active');
    document.getElementById('btnOverviewGrafico').classList.remove('active');

    if (tab === 'treino') {
      document.getElementById('tabAdminTreino').classList.remove('hidden');
      document.getElementById('btnOverviewTreino').classList.add('active');
    } else if (tab === 'dieta') {
      document.getElementById('tabAdminDieta').classList.remove('hidden');
      document.getElementById('btnOverviewDieta').classList.add('active');
    } else {
      document.getElementById('tabAdminGrafico').classList.remove('hidden');
      document.getElementById('btnOverviewGrafico').classList.add('active');
      populateExerciseSelect();
    }
  }

  function loadStudentOverview() {
    const studentCode = document.getElementById('studentSelect').value;

    fetch(`data/${studentCode}.json?t=${Date.now()}`)
      .then(res => res.json())
      .then(data => {
        currentStudentData = data;
        renderWorkoutOverview(data);
        renderDietOverview(data);
        populateExerciseSelect();
      })
      .catch(err => {
        document.getElementById('workoutContent').innerHTML = `<span style="color:var(--accent)">Erro ao carregar data/${studentCode}.json</span>`;
        document.getElementById('dietContent').innerHTML = `<span style="color:var(--accent)">Erro ao carregar dados de dieta.</span>`;
      });
  }

  function renderWorkoutOverview(data) {
    const container = document.getElementById('workoutContent');
    container.innerHTML = '';

    if (!data.days || data.days.length === 0) {
      container.innerHTML = 'Nenhum dia de treino cadastrado.';
      return;
    }

    data.days.forEach(day => {
      let html = `<div style="font-weight:700; color:var(--gold); margin:12px 0 6px 0; font-size:14px;">${day.title}</div>`;
      (day.exercicios || []).forEach((ex, idx) => {
        const savedLoad = localStorage.getItem(`c_${data.code}_${day.id}_${idx}`) || 'Nenhuma carga anotada neste aparelho';
        html += `
          <div class="item-box">
            <div class="item-header">
              <span class="item-title">${ex.nome}</span>
              <span class="item-meta">${ex.series}x (${ex.reps})</span>
            </div>
            <div style="font-size:12px; color:var(--green); margin-top:4px;">💪 Carga Salva: ${savedLoad}</div>
          </div>
        `;
      });
      container.innerHTML += html;
    });
  }

  function renderDietOverview(data) {
    const container = document.getElementById('dietContent');
    container.innerHTML = '';

    if (!data.refeicoes || data.refeicoes.length === 0) {
      container.innerHTML = 'Nenhuma refeição cadastrada.';
      return;
    }

    data.refeicoes.forEach(ref => {
      container.innerHTML += `
        <div class="item-box">
          <div class="item-title" style="color:var(--gold);">${ref.titulo}</div>
          <div class="item-body">${ref.alimentos}</div>
        </div>
      `;
    });
  }

  function populateExerciseSelect() {
    const select = document.getElementById('exerciseSelect');
    select.innerHTML = '<option value="">Selecione um exercício...</option>';

    if (!currentStudentData || !currentStudentData.days) return;

    currentStudentData.days.forEach(day => {
      (day.exercicios || []).forEach((ex, idx) => {
        const opt = document.createElement('option');
        opt.value = `${day.id}_${idx}`;
        opt.textContent = `${day.title} — ${ex.nome}`;
        select.appendChild(opt);
      });
    });
  }

  function updateChart() {
    const exKey = document.getElementById('exerciseSelect').value;
    const studentCode = document.getElementById('studentSelect').value;
    
    if (!exKey) return;

    const rawLoad = localStorage.getItem(`c_${studentCode}_${exKey}`) || '0';
    const parsedLoad = parseFloat(rawLoad.replace(/[^0-9.]/g, '')) || 0;

    const ctx = document.getElementById('loadChart').getContext('2d');

    if (chartInstance) {
      chartInstance.destroy();
    }

    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Semana 1', 'Semana 2', 'Semana 3', 'Registro Atual'],
        datasets: [{
          label: 'Carga (kg)',
          data: [parsedLoad * 0.85, parsedLoad * 0.90, parsedLoad * 0.95, parsedLoad],
          borderColor: '#c4324f',
          backgroundColor: 'rgba(196, 50, 79, 0.2)',
          borderWidth: 3,
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: { beginAtZero: true, grid: { color: '#4a0d1a' }, ticks: { color: '#d8b3bb' } },
          x: { grid: { color: '#4a0d1a' }, ticks: { color: '#d8b3bb' } }
        },
        plugins: {
          legend: { labels: { color: '#fff' } }
        }
      }
    });
  }
</script>
</body>
</html>
